id: install-platform-agent
active: true
name: Install platform metrics agent
description: >
  Proven template: installs the Python agent and systemd unit, sends metrics to the ingest URL.
  The AI agent only fills variables (host, token, URLs) and does not write the playbook from scratch.
tags:
  - agent
  - bootstrap
  - monitoring
vars_schema:
  ssh_user:
    type: string
    required: true
  ingest_url:
    type: string
    required: true
  agent_token:
    type: string
    required: true
  remote_agent_path:
    type: string
    default: /opt/lambot/agent/remote_agent.py
