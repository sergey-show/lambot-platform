id: provision-nexus-ck
active: true
name: Nexus 3 OSS (cloudkrafter.nexus)
description: >
  Sonatype Nexus 3 OSS via the cloudkrafter.nexus collection (role nexus_oss): install on the host,
  without Docker. Then REST: hosted Maven/Docker and a credentials file for Lambot.
  Default JVM memory is lowered to ~768M for small VMs (see playbook).
tags:
  - nexus
  - ansible-galaxy
  - cloudkrafter
vars_schema:
  ssh_user:
    type: string
    required: true
  server_host:
    type: string
    required: true
  nexus_http_port:
    type: integer
    required: true
  nexus_docker_port:
    type: integer
    required: true
  nexus_url:
    type: string
    required: true
  nexus_host:
    type: string
    required: true
  lambot_project_id:
    type: string
    required: true
  lambot_project_slug:
    type: string
    required: true
  lambot_project_name:
    type: string
    required: true
  lambot_service_password:
    type: string
    required: true
