id: provision-nexus
active: true
name: Provision Sonatype Nexus (Docker)
description: >
  Brings up Nexus via docker compose (UI + Docker Registry on host ports), sets admin password,
  creates hosted Maven and Docker repositories under the project slug, writes nexus-credentials.json for adapter.
tags:
  - nexus
  - docker
  - infra
vars_schema:
  ssh_user:
    type: string
    required: true
  server_host:
    type: string
    required: true
  nexus_http_port:
    type: integer
    required: true
  nexus_docker_port:
    type: integer
    required: true
  nexus_url:
    type: string
    required: true
  nexus_host:
    type: string
    required: true
  lambot_project_id:
    type: string
    required: true
  lambot_project_slug:
    type: string
    required: true
  lambot_service_password:
    type: string
    required: true
