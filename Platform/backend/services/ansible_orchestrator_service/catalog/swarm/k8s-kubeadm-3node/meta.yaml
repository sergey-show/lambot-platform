id: k8s-kubeadm-3node
active: true
name: Kubernetes (kubeadm, 3 nodes)
description: >
  Installs containerd, kubeadm, kubelet, and kubectl on three Debian/Ubuntu hosts:
  one control plane and two workers. Pod network — Flannel (default 10.244.0.0/16).
  Inventory with masters/workers groups and pod_network_cidr is set at launch from the platform
  (three SSH targets with the same user and the same key or password).
tags:
  - kubernetes
  - kubeadm
vars_schema: {}
