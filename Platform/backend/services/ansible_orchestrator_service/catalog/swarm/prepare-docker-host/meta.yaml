id: prepare-docker-host
active: true
name: Prepare host for Docker workloads
description: >
  Base prep: docker.io, Docker Compose v2 (binary in cli-plugins from GitHub), docker service, user in the docker group.
  Adapter runs this template automatically before provision-gitlab and provision-nexus on the same target.
tags:
  - docker
  - infra
vars_schema:
  ssh_user:
    type: string
    required: true
