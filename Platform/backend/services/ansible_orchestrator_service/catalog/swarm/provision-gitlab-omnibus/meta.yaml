id: provision-gitlab-omnibus
active: true
name: GitLab CE (Omnibus, robertdebock.gitlab)
description: >
  Installs GitLab CE via the Omnibus package on the target host (role robertdebock.gitlab).
  Suitable for Ubuntu LTS / RHEL-like systems from the role meta. Does not use Docker —
  the prepare-docker-host step is not required for this template.
  After install, creates the project group, user, and API PAT (as in the docker variant).
tags:
  - gitlab
  - omnibus
  - ansible-galaxy
vars_schema:
  ssh_user:
    type: string
    required: true
  server_host:
    type: string
    required: true
  gitlab_http_port:
    type: integer
    required: true
  gitlab_external_url:
    type: string
    required: true
  lambot_project_id:
    type: string
    required: true
  lambot_project_slug:
    type: string
    required: true
  lambot_project_name:
    type: string
    required: true
  lambot_service_password_b64:
    type: string
    required: true
