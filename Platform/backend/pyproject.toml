[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambot-platform-backend"
version = "0.1.0"
description = "Backend services for multi-agent development platform MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "httpx>=0.27.2",
  "websockets>=12.0",
  "aiokafka>=0.11.0",
  "kafka-python>=2.0.2",
  "PyJWT>=2.9.0",
  "PyYAML>=6.0.2",
  "boto3>=1.35.0",
  "Jinja2>=3.1.4",
  "cryptography>=43.0.0",
  "bcrypt>=4.2.0",
  "paramiko>=3.4.0",
  "ansible-core>=2.16.0",
  "clickhouse-connect>=0.7.0",
  "langgraph>=0.2.55",
  "langchain-core>=0.3.30",
  "langchain-openai>=0.2.14",
  "langchain>=0.3.30",
  "langfuse>=2.59.0",
  "redis>=5.0.0",
  "qdrant-client>=1.12.0",
  "pypdf>=5.0.0",
  "playwright>=1.50.0",
  "pytest>=8.3.3",
  "testcontainers[postgres,kafka]>=4.8.2"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*"]
