[defaults]
roles_path = /app/ansible/roles
# Ansible 2.14+: canonical key is collections_path (plural "paths" in env: ANSIBLE_COLLECTIONS_PATHS)
collections_path = /app/ansible/collections
host_key_checking = False
retry_files_enabled = False

[galaxy]
# Image build: downloading collections from galaxy.ansible.com (default ~60s — too low for large tgz)
server_timeout = 300
