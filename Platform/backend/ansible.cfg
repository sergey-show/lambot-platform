[defaults]
roles_path = /app/ansible/roles
# Ansible 2.14+: canonical key is collections_path (plural «paths» в env: ANSIBLE_COLLECTIONS_PATHS)
collections_path = /app/ansible/collections
host_key_checking = False
retry_files_enabled = False

[galaxy]
# Сборка образа: скачивание коллекций с galaxy.ansible.com (по умолчанию ~60s — мало для больших tgz)
server_timeout = 300
