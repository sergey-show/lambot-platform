  <body>
    <div id="app"></div>
    <script>
      (function () {
        var h = (location.hash || "").replace(/^#/, "").trim();
        if (!h || h === "/") {
          location.replace(location.pathname + location.search + "#/login");
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
